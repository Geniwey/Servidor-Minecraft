name: Servidor Minecraft 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: servidor-minecraft
  cancel-in-progress: true

jobs:
  iniciar_servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Preparar Java (JAVA 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Descargar mundo
        run: |
          rclone copy gdrive:ZerdolandIII.tar.gz ./ || true
          if [ -f "ZerdolandIII.tar.gz" ]; then
            echo "📦 Descomprimiendo mundo..."
            tar -xzf ZerdolandIII.tar.gz
            rm ZerdolandIII.tar.gz
          else
            mkdir -p servidor
            rclone copy gdrive:ZerdolandIII ./servidor --transfers 8 || true
          fi

      - name: Descargar y probar Playit
        run: |
          echo "📥 Descargando Playit..."
          curl -SsL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          
          echo "🧪 Verificando ejecutable..."
          file playit
          ls -lh playit
          
          echo "🧪 Probando ejecución..."
          timeout 5s ./playit --help || echo "Help ejecutado (timeout esperado)"

      - name: Arrancar Playit
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 ARRANCANDO PLAYIT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Crear directorio de config
          mkdir -p ~/.config/playit_gg
          
          # Arrancar Playit
          echo "Ejecutando: ./playit"
          ./playit > playit.log 2>&1 &
          PLAYIT_PID=$!
          
          echo "✅ Playit arrancado (PID: $PLAYIT_PID)"
          
          # Esperar a que genere logs
          sleep 10
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 LOG DE PLAYIT (primeras 30 líneas):"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          head -n 30 playit.log || cat playit.log
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Verificar si sigue corriendo
          if kill -0 $PLAYIT_PID 2>/dev/null; then
            echo "✅ Playit está corriendo"
          else
            echo "❌ Playit se detuvo"
            echo ""
            echo "📋 LOG COMPLETO:"
            cat playit.log
            exit 1
          fi
          
          # Buscar link o IP
          LINK=$(grep -oE 'https://playit\.gg/claim/[a-zA-Z0-9-]+' playit.log | head -1 || true)
          IP=$(grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' playit.log | head -1 || true)
          
          echo ""
          if [ -n "$LINK" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔗 VINCULA TU AGENTE AQUÍ:"
            echo ""
            echo "$LINK"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          elif [ -n "$IP" ]; then
            echo "✅ IP detectada: $IP"
          else
            echo "⏳ Aún no hay link ni IP (esperando...)"
          fi
          
          # Monitor en background
          (
            while true; do
              sleep 20
              
              if ! kill -0 $PLAYIT_PID 2>/dev/null; then
                echo "❌ Playit murió en el monitor"
                exit 1
              fi
              
              LINK=$(grep -oE 'https://playit\.gg/claim/[a-zA-Z0-9-]+' playit.log | tail -1 || true)
              IP=$(grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' playit.log | tail -1 || true)
              
              echo ""
              echo "🔄 $(date '+%H:%M:%S')"
              
              if [ -n "$IP" ]; then
                echo "✅ IP ACTIVA: $IP"
                
                # Guardar config si existe
                if [ -d ~/.config/playit_gg ] && [ "$(ls -A ~/.config/playit_gg)" ]; then
                  rclone copy ~/.config/playit_gg/ gdrive:playit_config/ -v 2>&1 | head -5
                fi
                
              elif [ -n "$LINK" ]; then
                echo "⚠️ Esperando vinculación: $LINK"
              else
                echo "⏳ Iniciando..."
                tail -n 2 playit.log
              fi
            done
          ) &
          
          echo ""
          echo "🎮 Monitor de Playit activo en background"

      - name: Arrancar Minecraft
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎮 INICIANDO MINECRAFT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd servidor
          
          if [ ! -f "run.sh" ]; then
            echo "❌ run.sh no encontrado"
            ls -la
            exit 1
          fi
          
          echo "eula=true" > eula.txt
          chmod +x run.sh
          
          ./run.sh

      - name: Guardar todo
        if: always()
        run: |
          echo ""
          echo "💾 Guardando mundo..."
          tar -czf ZerdolandIII.tar.gz servidor
          rclone copy ZerdolandIII.tar.gz gdrive: -v || true
          
          echo ""
          echo "💾 Guardando config de Playit..."
          if [ -d ~/.config/playit_gg ] && [ "$(ls -A ~/.config/playit_gg)" ]; then
            ls -lah ~/.config/playit_gg/
            rclone copy ~/.config/playit_gg/ gdrive:playit_config/ -v || true
          fi
          
          echo ""
          echo "📋 Log final de Playit:"
          tail -n 20 playit.log 2>/dev/null || echo "(sin log)"
