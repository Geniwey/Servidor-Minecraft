name: Servidor Minecraft 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: servidor-minecraft
  cancel-in-progress: true

jobs:
  iniciar_servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Preparar Java (JAVA 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Rclone (Conexión a Drive)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Descargar el mundo y TU IP FIJA
        run: |
          # 1. Descargar el mundo
          rclone copy gdrive:ZerdolandIII.tar.gz ./ || true
          if [ -f "ZerdolandIII.tar.gz" ]; then
            tar -xzf ZerdolandIII.tar.gz
            rm ZerdolandIII.tar.gz
          else
            mkdir -p servidor
            rclone copy gdrive:ZerdolandIII ./servidor --transfers 8 || true
          fi
          
          # 2. Descargar la configuración mágica de Playit (El billete dorado)
          echo "Descargando configuración de Playit desde Drive..."
          sudo mkdir -p /root/.config/playit_gg
          sudo mkdir -p /root/.config/playit
          
          # Bajamos la carpeta que se acaba de guardar
          rclone copy gdrive:playit_config/ ./playit_config_temp/ || true
          
          if [ -d "./playit_config_temp" ]; then
            # Se la inyectamos al administrador
            sudo cp -r ./playit_config_temp/* /root/.config/playit_gg/ || true
            sudo cp -r ./playit_config_temp/* /root/.config/playit/ || true
            sudo chmod -R 777 /root/.config/playit_gg || true
            sudo chmod -R 777 /root/.config/playit || true
            echo "✅ Configuración de Playit restaurada con éxito."
          else
            echo "⚠️ No se encontró la carpeta playit_config en Drive."
          fi

      - name: Arrancar Playit y Servidor
        run: |
          # Descargamos Playit
          curl -SsL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          
          # Arrancamos como administrador (Leerá tu billete dorado automáticamente)
          sudo ./playit > playit.log 2>&1 &
          
          # Monitor ultra limpio: Solo busca tu IP y arranca
          (
            while true; do
              IP=$(grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' playit.log | tail -n 1 || true)
              
              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              if [ -n "$IP" ]; then
                echo "✅ SERVIDOR ACTIVO. TU IP FIJA ES: $IP"
                break
              else
                echo "⏳ Leyendo tu configuración secreta y conectando túnel..."
              fi
              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              sleep 15
            done
          ) &
          
          # Arrancar Minecraft
          cd servidor
          echo "eula=true" > eula.txt
          chmod +x run.sh
          ./run.sh

      - name: Guardar mundo y seguro final
        if: always()
        run: |
          echo "Empaquetando servidor..."
          tar -czf ZerdolandIII.tar.gz servidor
          rclone copy ZerdolandIII.tar.gz gdrive: || true
          
          # Guardamos la config de Playit de nuevo por seguridad
          sudo cp -r /root/.config/playit_gg ./playit_config || sudo cp -r /root/.config/playit ./playit_config || true
          sudo chmod -R 777 ./playit_config || true
          rclone copy ./playit_config/ gdrive:playit_config/ || true
