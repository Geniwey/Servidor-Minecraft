name: Servidor Minecraft 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: servidor-minecraft
  cancel-in-progress: true

jobs:
  iniciar_servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Preparar Java (JAVA 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Rclone (Conexión a Drive)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Descargar el mundo y TU IP FIJA
        run: |
          # 1. Descarga limpia adaptada a cualquier extensión (.tar.gz o .tar)
          rclone copy gdrive:ZerdolandIII.tar.gz ./ --multi-thread-streams 1 || true
          rclone copy gdrive:ZerdolandIII.tar ./ --multi-thread-streams 1 || true
          
          if [ -f "ZerdolandIII.tar.gz" ]; then
            echo "📦 Descomprimiendo .tar.gz..."
            tar -xf ZerdolandIII.tar.gz
            rm ZerdolandIII.tar.gz
          elif [ -f "ZerdolandIII.tar" ]; then
            echo "📦 Descomprimiendo .tar..."
            tar -xf ZerdolandIII.tar
            rm ZerdolandIII.tar
          else
            echo "⚠️ No se encontró archivo comprimido, descargando carpeta suelta..."
            rclone copy gdrive:ZerdolandIII ./ZerdolandIII --transfers 8 || true
          fi
          
          # 2. Descargar la configuración de Playit
          echo "Descargando configuración de Playit desde Drive..."
          sudo mkdir -p /etc/playit
          rclone copy gdrive:playit_config/ ./playit_config_temp/ --multi-thread-streams 1 || true
          
          if [ -d "./playit_config_temp" ]; then
            sudo cp -r ./playit_config_temp/* /etc/playit/ || true
            sudo chmod -R 777 /etc/playit || true
            echo "✅ Configuración de Playit restaurada."
          else
            echo "⚠️ No se encontró la carpeta playit_config."
          fi

      - name: Abrir puertos para Voice Chat
        run: |
          sudo ufw allow 45678/udp
          sudo ufw reload

      - name: Arrancar Playit y Servidor
        run: |
          # 1. Instalar dependencias (añadido 'screen' para el control del servidor)
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" | sudo tee /etc/apt/sources.list.d/playit-cloud.list
          sudo apt update
          sudo apt install playit screen -y
          
          # 2. Arrancar Playit
          sudo service playit stop || true
          sudo bash -c 'playit > playit.log 2>&1' &
          
          # 3. Monitor de IP
          (
            while true; do
              IP=$(grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' playit.log | tail -n 1 || true)
              
              if [ -n "$IP" ]; then
                echo "✅ SERVIDOR ACTIVO. TU IP FIJA ES: $IP"
                break
              fi
              sleep 15
            done
          ) &
          
          # 4. Arrancar Minecraft en sesión oculta (screen)
          cd ZerdolandIII
          echo "eula=true" > eula.txt
          chmod +x run.sh
          screen -d -m -S mcserver ./run.sh
          
          echo "⏳ Servidor en marcha. Iniciando monitor de guardado (290 mins)..."
          
          # Bucle que vigila el servidor durante 4 horas y 50 minutos
          for i in {1..290}; do
            if ! screen -list | grep -q "mcserver"; then
              echo "⚠️ El servidor se cerró antes de tiempo por un error interno."
              break
            fi
            sleep 60
          done
          
          # 5. Apagado suave y guardado forzoso
          if screen -list | grep -q "mcserver"; then
            echo "🛑 Iniciando guardado y apagado seguro..."
            screen -S mcserver -X stuff "say ⚠️ REINICIO DEL SERVIDOR EN 10 SEGUNDOS PARA GUARDAR EL MUNDO$(printf \\r)"
            sleep 10
            screen -S mcserver -X stuff "save-all$(printf \\r)"
            sleep 10
            screen -S mcserver -X stuff "stop$(printf \\r)"
            
            while screen -list | grep -q "mcserver"; do
              echo "Esperando a que termine de guardar en disco..."
              sleep 5
            done
            echo "✅ Guardado completado sin pérdida de datos."
          fi

      - name: Guardar mundo y seguro final
        if: always()
        run: |
          echo "Empaquetando servidor..."
          tar -cf ZerdolandIII.tar ZerdolandIII
          rclone copy ZerdolandIII.tar gdrive: --multi-thread-streams 1 || true
          
          sudo cp -r /etc/playit ./playit_config || true
          sudo chmod -R 777 ./playit_config || true
          rclone copy ./playit_config/ gdrive:playit_config/ --multi-thread-streams 1 || true
