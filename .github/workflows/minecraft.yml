name: Servidor Minecraft 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: servidor-minecraft
  cancel-in-progress: true

jobs:
  iniciar_servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Preparar Java (JAVA 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Rclone (Conexión a Drive)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Descargar el mundo y configuración
        run: |
          rclone copy gdrive:ZerdolandIII.tar.gz ./ --multi-thread-streams 1 || true
          rclone copy gdrive:ZerdolandIII.tar ./ --multi-thread-streams 1 || true
          
          if [ -f "ZerdolandIII.tar.gz" ]; then
            echo "📦 Descomprimiendo .tar.gz..."
            tar -xf ZerdolandIII.tar.gz
            rm ZerdolandIII.tar.gz
          elif [ -f "ZerdolandIII.tar" ]; then
            echo "📦 Descomprimiendo .tar..."
            tar -xf ZerdolandIII.tar
            rm ZerdolandIII.tar
          else
            echo "⚠️ No hay TAR. Rescatando desde la carpeta suelta (Plan C)..."
            rclone copy gdrive:ZerdolandIII ./ZerdolandIII --transfers 16 --checkers 32 || true
          fi
          
          sudo mkdir -p /etc/playit
          rclone copy gdrive:playit_config/ ./playit_config_temp/ --multi-thread-streams 1 || true
          if [ -d "./playit_config_temp" ]; then
            sudo cp -r ./playit_config_temp/* /etc/playit/ || true
            sudo chmod -R 777 /etc/playit || true
          fi

      - name: Abrir puertos para Voice Chat
        run: |
          sudo ufw allow 45678/udp
          sudo ufw reload

      - name: Arrancar Playit y Servidor
        run: |
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" | sudo tee /etc/apt/sources.list.d/playit-cloud.list
          sudo apt update
          sudo apt install playit screen -y
          
          sudo service playit stop || true
          sudo bash -c 'playit > playit.log 2>&1' &
          
          # Monitor de Playit
          (
            while true; do
              IP=$(grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' playit.log | tail -n 1 || true)
              if [ -n "$IP" ]; then
                echo "✅ SERVIDOR ACTIVO. TU IP FIJA ES: $IP"
                break
              fi
              sleep 15
            done
          ) &
          
          cd ZerdolandIII
          echo "eula=true" > eula.txt
          chmod +x run.sh
          screen -d -m -S mcserver ./run.sh
          
          echo "⏳ Servidor en marcha. Triple seguridad activada."
          
          # RELOJ MAESTRO Y AUTOGUARDADO INTELIGENTE
          TIEMPO_INICIO=$(date +%s)
          sleep 600
          
          while true; do
            TIEMPO_ACTUAL=$(date +%s)
            TIEMPO_TRANSCURRIDO=$((TIEMPO_ACTUAL - TIEMPO_INICIO))
            
            # 16800 segundos = 4 horas y 40 minutos.
            if [ $TIEMPO_TRANSCURRIDO -ge 16800 ]; then
              echo "⏰ 4 horas y 40 minutos completados. Iniciando transición al apagado seguro..."
              break
            fi
            
            if screen -list | grep -q "mcserver"; then
              echo "💾 Iniciando backups rápidos en Drive..."
              screen -S mcserver -X stuff "say 💾 Guardando progreso en la nube...$(printf \\r)"
              
              screen -S mcserver -X stuff "save-off$(printf \\r)"
              screen -S mcserver -X stuff "save-all$(printf \\r)"
              sleep 15
              
              tar -cf $GITHUB_WORKSPACE/ZerdolandIII.tar -C $GITHUB_WORKSPACE ZerdolandIII
              
              screen -S mcserver -X stuff "save-on$(printf \\r)"
              screen -S mcserver -X stuff "say ✅ Guardado cerrado. Subiendo a Drive.$(printf \\r)"
              
              rclone copyto gdrive:ZerdolandIII.tar gdrive:ZerdolandIII_copia_seguridad.tar || true
              rclone copy $GITHUB_WORKSPACE/ZerdolandIII.tar gdrive: --multi-thread-streams 1 || true
              rclone sync $GITHUB_WORKSPACE/ZerdolandIII/ gdrive:ZerdolandIII/ --update --transfers 16 --checkers 32 || true
            else
              echo "⚠️ El servidor se cerró desde dentro antes de tiempo."
              break
            fi
            
            sleep 1800
          done

      - name: Guardar mundo y seguro final
        if: always()
        run: |
          echo "🛑 INICIANDO PROTOCOLO DE APAGADO SEGURO..."
          
          if screen -list | grep -q "mcserver"; then
            screen -S mcserver -X stuff "say ⚠️ EL SERVIDOR SE ESTÁ APAGANDO PARA EL REINICIO SEGURO.$(printf \\r)"
            sleep 3
            
            screen -S mcserver -X stuff "save-all$(printf \\r)"
            sleep 15
            
            screen -S mcserver -X stuff "stop$(printf \\r)"
            
            contador=0
            while screen -list | grep -q "mcserver"; do
              sleep 5
              contador=$((contador+5))
              if [ $contador -ge 300 ]; then
                break
              fi
            done
          fi
          
          echo "📦 Empaquetando copia final..."
          tar -cf $GITHUB_WORKSPACE/ZerdolandIII.tar -C $GITHUB_WORKSPACE ZerdolandIII
          
          echo "☁️ Creando copia de seguridad espejo en Drive..."
          rclone copyto gdrive:ZerdolandIII.tar gdrive:ZerdolandIII_copia_seguridad.tar || true
          
          echo "🚀 INICIANDO MODO FÓRMULA 1: Subiendo archivos en paralelo a Drive..."
          # Al poner un "&" al final, las subidas se hacen a la vez en lugar de esperar su turno
          
          # Tarea 1: Subir el .tar usando 4 canales de internet a la vez
          rclone copy $GITHUB_WORKSPACE/ZerdolandIII.tar gdrive: --multi-thread-streams 4 &
          
          # Tarea 2: Subir la carpeta suelta forzando 32 transferencias de golpe
          rclone sync $GITHUB_WORKSPACE/ZerdolandIII/ gdrive:ZerdolandIII/ --update --transfers 32 --checkers 64 &
          
          # Tarea 3: Guardar IPs de Playit
          sudo cp -r /etc/playit $GITHUB_WORKSPACE/playit_config || true
          sudo chmod -R 777 $GITHUB_WORKSPACE/playit_config || true
          rclone copy $GITHUB_WORKSPACE/playit_config/ gdrive:playit_config/ &
          
          # "wait" le dice a GitHub que espere hasta que las 3 tareas terminen antes de dar por cerrado el servidor
          wait
          
          echo "✅ CICLO Y SUBIDAS COMPLETADOS A MÁXIMA VELOCIDAD."
