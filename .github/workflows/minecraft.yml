name: Servidor Minecraft 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: servidor-minecraft
  cancel-in-progress: true

jobs:
  iniciar_servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Preparar Java (JAVA 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Rclone (Conexión a Drive)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Descargar mundo y configuración
        run: |
          # Intentar descargar config guardada
          mkdir -p ~/.config/playit_gg
          rclone copy gdrive:playit_config/ ~/.config/playit_gg/ || true
          
          echo "📁 Configuración en Drive:"
          if [ -f ~/.config/playit_gg/playit.toml ]; then
            echo "✅ Encontrada - usando configuración guardada"
            ls -lah ~/.config/playit_gg/
          else
            echo "⚠️ No encontrada - primera ejecución"
          fi
          
          # Descargar mundo
          rclone copy gdrive:ZerdolandIII.tar.gz ./ || true
          if [ -f "ZerdolandIII.tar.gz" ]; then
            echo "📦 Descomprimiendo mundo..."
            tar -xzf ZerdolandIII.tar.gz
            rm ZerdolandIII.tar.gz
          else
            mkdir -p servidor
            rclone copy gdrive:ZerdolandIII ./servidor --transfers 8 || true
          fi

      - name: Descargar Playit
        run: |
          curl -SsL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          echo "✅ Playit descargado"

      - name: Arrancar Playit y Servidor
        run: |
          echo "🚀 Iniciando Playit..."
          
          # 🎯 CLAVE: Usar el modo "claim" directamente
          # Esto evita el problema del daemon/socket
          
          if [ -f ~/.config/playit_gg/playit.toml ]; then
            echo "🔑 Usando configuración existente"
            # Modo normal con configuración
            PLAYIT_SECRET=$(grep "secret_key" ~/.config/playit_gg/playit.toml | cut -d'"' -f2)
            if [ -n "$PLAYIT_SECRET" ]; then
              echo "secret_key = \"$PLAYIT_SECRET\"" > /tmp/playit.toml
              ./playit --config /tmp/playit.toml &> playit.log &
            else
              ./playit &> playit.log &
            fi
          else
            echo "⚠️ Primera ejecución - generando configuración nueva"
            ./playit &> playit.log &
          fi
          
          PLAYIT_PID=$!
          echo "   PID: $PLAYIT_PID"
          
          sleep 10
          
          echo ""
          echo "📋 ESTADO INICIAL DE PLAYIT:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          head -n 20 playit.log
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Monitor
          (
            CONFIG_GUARDADA=false
            CICLOS=0
            
            while true; do
              CICLOS=$((CICLOS + 1))
              
              # Verificar si Playit murió
              if ! kill -0 $PLAYIT_PID 2>/dev/null; then
                echo ""
                echo "❌ PLAYIT SE DETUVO"
                echo ""
                echo "📋 LOG COMPLETO:"
                cat playit.log
                echo ""
                echo "🔧 Diagnostico:"
                echo "   - Tamaño del log: $(wc -l < playit.log) líneas"
                echo "   - Última línea: $(tail -n 1 playit.log)"
                echo ""
                exit 1
              fi
              
              LINK=$(grep -oE 'https://playit\.gg/claim/[a-zA-Z0-9-]+' playit.log 2>/dev/null | tail -1 || true)
              IP=$(grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' playit.log 2>/dev/null | tail -1 || true)
              
              # Solo mostrar cada 3 ciclos o cuando hay cambio
              if [ $((CICLOS % 3)) -eq 1 ] || [ -n "$LINK" ] || [ -n "$IP" ]; then
                echo ""
                echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
                echo "⏱️  Ciclo #$CICLOS - $(date '+%H:%M:%S')"
                echo ""
                
                if [ -n "$IP" ]; then
                  echo "✅ SERVIDOR ACTIVO"
                  echo "🌐 IP: $IP"
                  echo ""
                  
                  if [ "$CONFIG_GUARDADA" = false ]; then
                    echo "💾 Guardando configuración..."
                    sleep 5
                    
                    if [ -d ~/.config/playit_gg ] && [ "$(ls -A ~/.config/playit_gg 2>/dev/null)" ]; then
                      echo "📁 Archivos a guardar:"
                      ls -lah ~/.config/playit_gg/
                      
                      if rclone copy ~/.config/playit_gg/ gdrive:playit_config/ -v; then
                        echo "✅ ¡CONFIGURACIÓN GUARDADA!"
                        CONFIG_GUARDADA=true
                      fi
                    fi
                  else
                    echo "💚 Configuración permanente activa"
                  fi
                  
                elif [ -n "$LINK" ]; then
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "⚠️  ¡VINCULA TU AGENTE!"
                  echo ""
                  echo "🔗 $LINK"
                  echo ""
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo ""
                  echo "📝 INSTRUCCIONES:"
                  echo "   1. Copia y pega el link en tu navegador"
                  echo "   2. Inicia sesión en Playit.gg"
                  echo "   3. Después, ve a https://playit.gg/account/tunnels"
                  echo "   4. Crea un túnel TCP para el puerto 25565"
                  echo ""
                  echo "⏳ Esperando vinculación..."
                  
                else
                  echo "⏳ Iniciando..."
                  echo ""
                  echo "📋 Últimas líneas:"
                  tail -n 5 playit.log 2>/dev/null | grep -v "^$"
                fi
                
                echo ""
                echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
                echo ""
              fi
              
              sleep 20
            done
          ) &
          
          # Esperar un poco antes de Minecraft
          sleep 15
          
          # Arrancar Minecraft
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎮 INICIANDO MINECRAFT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          cd servidor
          
          if [ ! -f "run.sh" ]; then
            echo "❌ run.sh no encontrado"
            ls -la
            exit 1
          fi
          
          echo "eula=true" > eula.txt
          chmod +x run.sh
          ./run.sh

      - name: Guardar mundo y configuración
        if: always()
        run: |
          echo ""
          echo "💾 Guardando..."
          
          # Mundo
          tar -czf ZerdolandIII.tar.gz servidor
          rclone copy ZerdolandIII.tar.gz gdrive: -v || true
          
          # Configuración Playit
          if [ -d ~/.config/playit_gg ] && [ "$(ls -A ~/.config/playit_gg)" ]; then
            rclone copy ~/.config/playit_gg/ gdrive:playit_config/ -v || true
          fi
          
          echo "✅ Completado"
