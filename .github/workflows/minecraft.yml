name: Servidor Minecraft 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: servidor-minecraft
  cancel-in-progress: true

jobs:
  iniciar_servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Preparar Java (JAVA 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Rclone (Conexión a Drive)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Descargar el mundo y Configuración
        run: |
          # Descargamos LA CARPETA ENTERA para no perder ningún archivo de túnel
          mkdir -p ~/.config/playit_gg
          rclone copy gdrive:playit_config/ ~/.config/playit_gg/ || true
          
          # Descargar mundo
          rclone copy gdrive:ZerdolandIII.tar.gz ./ || true
          if [ -f "ZerdolandIII.tar.gz" ]; then
            tar -xzf ZerdolandIII.tar.gz
            rm ZerdolandIII.tar.gz
          else
            mkdir -p servidor
            rclone copy gdrive:ZerdolandIII ./servidor --transfers 8 || true
          fi

      - name: Descargar Playit (Versión Portátil)
        run: |
          curl -SsL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit

      - name: Arrancar Playit y Servidor
        run: |
          # 🎯 EL PARCHE NUCLEAR: Creamos a la fuerza la carpeta invisible que Playit exige
          sudo mkdir -p /run/user/$(id -u)
          sudo chown -R $(id -u):$(id -g) /run/user/$(id -u)
          sudo chmod 700 /run/user/$(id -u)
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          
          # Ejecutar SIN sudo
          ./playit &> playit.log &
          
          (
            CONFIG_GUARDADA=false
            while true; do
              LINK=$(grep -oE 'https://playit\.gg/claim/[a-zA-Z0-9-]+' playit.log | head -1 || true)
              IP=$(grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' playit.log | head -1 || true)
              
              echo ""
              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              
              if [ -n "$IP" ]; then
                echo "✅ SERVIDOR ACTIVO. TU IP: $IP"
                
                # Guardar TODA la carpeta en cuanto haya IP
                if [ "$CONFIG_GUARDADA" = false ]; then
                  echo "💾 Guardando configuración completa en Drive..."
                  sleep 5
                  
                  if rclone copy ~/.config/playit_gg/ gdrive:playit_config/ ; then
                    echo "✅ ¡CONFIGURACIÓN GUARDADA DEFINITIVAMENTE!"
                    CONFIG_GUARDADA=true
                  fi
                else
                  echo "💚 Configuración asegurada en tu Drive."
                fi
                
              elif [ -n "$LINK" ]; then
                echo "⚠️ FALTA VINCULAR PLAYIT. CLICA AQUÍ YA: $LINK"
                echo "👉 NOTA: Si tras vincular no sale la IP, entra a la web de Playit"
                echo "   y asegúrate de crear un túnel TCP al puerto 25565."
              else
                echo "⏳ Iniciando túnel..."
                echo "   [Último mensaje de Playit:]"
                tail -n 2 playit.log || true
              fi
              
              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              echo ""
              sleep 20
            done
          ) &
          
          cd servidor
          echo "eula=true" > eula.txt
          chmod +x run.sh
          ./run.sh

      - name: Guardar mundo y seguro final
        if: always()
        run: |
          echo "Empaquetando servidor..."
          tar -czf ZerdolandIII.tar.gz servidor
          rclone copy ZerdolandIII.tar.gz gdrive: || true
          
          echo "Asegurando configuración final..."
          if [ -d ~/.config/playit_gg ]; then
            rclone copy ~/.config/playit_gg/ gdrive:playit_config/ || true
          fi
