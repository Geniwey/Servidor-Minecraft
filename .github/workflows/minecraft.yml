name: Servidor Minecraft 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: servidor-minecraft
  cancel-in-progress: true

jobs:
  iniciar_servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    
    steps:
      - name: Preparar Java (JAVA 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Descargar configuración de Playit
        run: |
          echo "🔍 Buscando configuración guardada..."
          rclone copy gdrive:playit_secret.txt ./ || true
          
          if [ -f playit_secret.txt ]; then
            echo "✅ Secret key encontrada"
            cat playit_secret.txt
          else
            echo "⚠️ No hay secret guardada (primera vez)"
          fi

      - name: Descargar mundo
        run: |
          rclone copy gdrive:ZerdolandIII.tar.gz ./ || true
          if [ -f "ZerdolandIII.tar.gz" ]; then
            echo "📦 Descomprimiendo mundo..."
            tar -xzf ZerdolandIII.tar.gz
            rm ZerdolandIII.tar.gz
          else
            mkdir -p servidor
            rclone copy gdrive:ZerdolandIII ./servidor --transfers 8 || true
          fi

      - name: Descargar Playit
        run: |
          curl -SsL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit

      - name: Arrancar Playit y Minecraft
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 INICIANDO PLAYIT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # 🔥 SOLUCIÓN DEFINITIVA: Usar variables de entorno para evitar daemon
          export PLAYIT_SECRET_PATH="$PWD/playit_secret.txt"
          
          if [ -f playit_secret.txt ]; then
            echo "🔑 Usando secret guardada"
            export PLAYIT_SECRET=$(cat playit_secret.txt)
          else
            echo "🆕 Primera ejecución"
          fi
          
          # Ejecutar en modo NO-DAEMON
          ./playit 2>&1 | tee playit.log &
          PLAYIT_PID=$!
          
          echo "   PID: $PLAYIT_PID"
          sleep 10
          
          echo ""
          echo "📋 Primeras líneas del log:"
          head -n 20 playit.log
          echo ""
          
          # Monitor y arranque de Minecraft en paralelo
          (
            SECRET_GUARDADA=false
            
            while true; do
              # Verificar que Playit sigue vivo
              if ! kill -0 $PLAYIT_PID 2>/dev/null; then
                echo "❌ Playit murió. Log completo:"
                cat playit.log
                break
              fi
              
              LINK=$(grep -oE 'https://playit\.gg/claim/[a-zA-Z0-9-]+' playit.log | tail -1 || true)
              IP=$(grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' playit.log | tail -1 || true)
              
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "⏱️  $(date '+%H:%M:%S')"
              
              if [ -n "$IP" ]; then
                echo "✅ SERVIDOR ACTIVO"
                echo "🌐 IP: $IP"
                
                # Extraer y guardar secret
                if [ "$SECRET_GUARDADA" = false ]; then
                  SECRET=$(grep -oP 'secret_key = "\K[^"]+' playit.log || grep -oP '"secret_key":\s*"\K[^"]+' playit.log || true)
                  
                  if [ -n "$SECRET" ]; then
                    echo "$SECRET" > playit_secret.txt
                    
                    if rclone copy playit_secret.txt gdrive: -v; then
                      echo "✅ Secret guardada para próximas ejecuciones"
                      SECRET_GUARDADA=true
                    fi
                  fi
                fi
                
              elif [ -n "$LINK" ]; then
                echo ""
                echo "⚠️  ¡ACCIÓN REQUERIDA!"
                echo ""
                echo "🔗 VINCULA AQUÍ: $LINK"
                echo ""
                echo "📝 Después ve a: https://playit.gg/account/tunnels"
                echo "   y crea un túnel TCP al puerto 25565"
                echo ""
              else
                echo "⏳ Iniciando túnel..."
                tail -n 3 playit.log
              fi
              
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              sleep 20
            done
          ) &
          
          # Esperar un poco antes de arrancar Minecraft
          sleep 15
          
          # Arrancar Minecraft
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎮 INICIANDO MINECRAFT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd servidor
          
          if [ ! -f "run.sh" ]; then
            echo "❌ run.sh no encontrado"
            ls -la
            exit 1
          fi
          
          echo "eula=true" > eula.txt
          chmod +x run.sh
          ./run.sh

      - name: Guardar mundo y configuración
        if: always()
        run: |
          echo ""
          echo "💾 Guardando mundo..."
          tar -czf ZerdolandIII.tar.gz servidor
          rclone copy ZerdolandIII.tar.gz gdrive: || true
          
          echo ""
          echo "💾 Guardando secret de Playit..."
          
          # Intentar extraer secret del log si no se guardó antes
          if [ -f playit.log ]; then
            SECRET=$(grep -oP 'secret_key = "\K[^"]+' playit.log || grep -oP '"secret_key":\s*"\K[^"]+' playit.log || true)
            
            if [ -n "$SECRET" ] && [ ! -f playit_secret.txt ]; then
              echo "$SECRET" > playit_secret.txt
            fi
          fi
          
          if [ -f playit_secret.txt ]; then
            rclone copy playit_secret.txt gdrive: || true
            echo "✅ Secret guardada"
          else
            echo "⚠️ No se pudo extraer la secret (puede que no se haya vinculado)"
          fi
          
          echo ""
          echo "✅ Guardado completado"
