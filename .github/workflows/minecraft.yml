name: Servidor Minecraft 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: servidor-minecraft
  cancel-in-progress: true

jobs:
  iniciar_servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Preparar Java (JAVA 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Rclone (Conexión a Drive)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Descargar el mundo
        run: |
          rclone copy gdrive:ZerdolandIII.tar.gz ./ || true
          if [ -f "ZerdolandIII.tar.gz" ]; then
            tar -xzf ZerdolandIII.tar.gz
            rm ZerdolandIII.tar.gz
          else
            mkdir -p servidor
            rclone copy gdrive:ZerdolandIII ./servidor --transfers 8 || true
          fi

      - name: Instalar Playit (Versión Oficial del Sistema)
        run: |
          # Instalación oficial. Linux se encarga de todo, cero errores de socket.
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" | sudo tee /etc/apt/sources.list.d/playit-cloud.list
          sudo apt update
          sudo apt install playit -y

      - name: Monitor de Playit y Link
        run: |
          (
            while true; do
              # Leemos directamente el registro del sistema
              LOGS=$(sudo journalctl -u playit --no-pager | tail -n 20)
              LINK=$(echo "$LOGS" | grep -oE 'https://playit\.gg/claim/[a-zA-Z0-9-]+' | tail -1 || true)
              IP=$(echo "$LOGS" | grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' | tail -1 || true)

              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              if [ -n "$IP" ]; then
                echo "✅ SERVIDOR ACTIVO. TU IP: $IP"
              elif [ -n "$LINK" ]; then
                echo "⚠️ FALTA VINCULAR PLAYIT. CLICA AQUÍ YA:"
                echo "🔗 $LINK"
              else
                echo "⏳ Esperando a Playit..."
              fi
              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              sleep 20
            done
          ) &

      - name: Arrancar Minecraft
        run: |
          cd servidor
          echo "eula=true" > eula.txt
          chmod +x run.sh
          ./run.sh

      - name: Guardar mundo
        if: always()
        run: |
          echo "Empaquetando servidor..."
          tar -czf ZerdolandIII.tar.gz servidor
          rclone copy ZerdolandIII.tar.gz gdrive: || true
