name: Servidor Minecraft 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: servidor-minecraft
  cancel-in-progress: true

jobs:
  iniciar_servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Preparar Java (JAVA 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Rclone (Conexión a Drive)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Descargar el mundo
        run: |
          rclone copy gdrive:ZerdolandIII.tar.gz ./ || true
          if [ -f "ZerdolandIII.tar.gz" ]; then
            tar -xzf ZerdolandIII.tar.gz
            rm ZerdolandIII.tar.gz
          else
            mkdir -p servidor
            rclone copy gdrive:ZerdolandIII ./servidor --transfers 8 || true
          fi

      - name: Arrancar Playit y Servidor
        run: |
          # 1. Instalar la versión oficial (adiós al os error 2)
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" | sudo tee /etc/apt/sources.list.d/playit-cloud.list
          sudo apt update
          sudo apt install playit -y
          
          # 2. Detener el servicio oculto que GitHub no sabe leer
          sudo service playit stop || true
          
          # 3. Arrancar Playit forzando a que escriba el log manual
          sudo bash -c 'playit > playit.log 2>&1' &
          
          # 4. Monitor leyendo el log manual
          (
            CONFIG_GUARDADA=false
            while true; do
              LINK=$(grep -oE 'https://playit\.gg/claim/[a-zA-Z0-9-]+' playit.log | tail -n 1 || true)
              IP=$(grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' playit.log | tail -n 1 || true)
              
              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              if [ -n "$IP" ]; then
                echo "✅ SERVIDOR ACTIVO. TU IP: $IP"
                if [ "$CONFIG_GUARDADA" = false ]; then
                  echo "💾 Guardando configuración de Playit..."
                  # La versión oficial guarda sus secretos en /etc/playit
                  sudo cp -r /etc/playit ./playit_config || true
                  sudo chmod -R 777 ./playit_config || true
                  if rclone copy ./playit_config/ gdrive:playit_config/ ; then
                    echo "✅ ¡CONFIGURACIÓN GUARDADA DEFINITIVAMENTE EN DRIVE!"
                    CONFIG_GUARDADA=true
                  fi
                fi
              elif [ -n "$LINK" ]; then
                echo "⚠️ FALTA VINCULAR PLAYIT. CLICA AQUÍ YA:"
                echo "🔗 $LINK"
              else
                echo "⏳ Iniciando túnel..."
                echo "📋 CHIVATO DE PLAYIT:"
                tail -n 3 playit.log || true
              fi
              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              sleep 20
            done
          ) &
          
          # 5. Arrancar Minecraft
          cd servidor
          echo "eula=true" > eula.txt
          chmod +x run.sh
          ./run.sh

      - name: Guardar mundo y seguro final
        if: always()
        run: |
          echo "Empaquetando servidor..."
          tar -czf ZerdolandIII.tar.gz servidor
          rclone copy ZerdolandIII.tar.gz gdrive: || true
          
          sudo cp -r /etc/playit ./playit_config || true
          sudo chmod -R 777 ./playit_config || true
          rclone copy ./playit_config/ gdrive:playit_config/ || true
