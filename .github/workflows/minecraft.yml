name: Servidor Minecraft 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: servidor-minecraft
  cancel-in-progress: true

jobs:
  iniciar_servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Preparar Java (JAVA 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Rclone (Conexión a Drive)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Descargar el mundo y Configuración
        run: |
          # Descargar configuración de Playit
          mkdir -p ~/.config/playit_gg
          rclone copy gdrive:playit_config/ ~/.config/playit_gg/ -v || true
          
          echo "📁 Archivos descargados:"
          ls -lah ~/.config/playit_gg/ 2>/dev/null || echo "   (primera ejecución)"
          
          # Descargar mundo
          rclone copy gdrive:ZerdolandIII.tar.gz ./ || true
          if [ -f "ZerdolandIII.tar.gz" ]; then
            echo "📦 Descomprimiendo mundo..."
            tar -xzf ZerdolandIII.tar.gz
            rm ZerdolandIII.tar.gz
          else
            echo "⚠️ Descargando carpeta completa..."
            mkdir -p servidor
            rclone copy gdrive:ZerdolandIII ./servidor --transfers 8 || true
          fi

      - name: Descargar Playit (Versión Portátil)
        run: |
          curl -SsL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          echo "✅ Playit descargado"

      - name: Arrancar Playit y Servidor
        run: |
          # 🎯 SOLUCIÓN: Ejecutar Playit directamente sin daemon
          # Esto evita el error del socket IPC
          
          echo "🚀 Arrancando Playit en modo directo..."
          
          # Si existe configuración previa, usarla
          if [ -f ~/.config/playit_gg/playit.toml ]; then
            echo "🔑 Usando configuración guardada"
            ./playit --secret-path ~/.config/playit_gg/playit.toml &> playit.log &
          else
            echo "⚠️ Primera ejecución, creando configuración nueva"
            ./playit &> playit.log &
          fi
          
          PLAYIT_PID=$!
          echo "   PID: $PLAYIT_PID"
          
          sleep 8
          
          # Monitor
          (
            CONFIG_GUARDADA=false
            CICLOS=0
            
            while true; do
              CICLOS=$((CICLOS + 1))
              
              # Verificar que Playit sigue corriendo
              if ! kill -0 $PLAYIT_PID 2>/dev/null; then
                echo ""
                echo "❌ PLAYIT SE DETUVO"
                echo "📋 Log completo:"
                cat playit.log
                echo ""
                
                # Reintentar una vez
                echo "🔄 Reintentando..."
                if [ -f ~/.config/playit_gg/playit.toml ]; then
                  ./playit --secret-path ~/.config/playit_gg/playit.toml &> playit.log &
                else
                  ./playit &> playit.log &
                fi
                PLAYIT_PID=$!
                sleep 8
                continue
              fi
              
              LINK=$(grep -oE 'https://playit\.gg/claim/[a-zA-Z0-9-]+' playit.log 2>/dev/null | head -1 || true)
              IP=$(grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' playit.log 2>/dev/null | head -1 || true)
              
              echo ""
              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              echo "⏱️  Ciclo #$CICLOS"
              echo ""
              
              if [ -n "$IP" ]; then
                echo "✅ SERVIDOR ACTIVO"
                echo "🌐 TU IP: $IP"
                echo ""
                
                if [ "$CONFIG_GUARDADA" = false ]; then
                  echo "💾 Guardando configuración..."
                  sleep 5
                  
                  # Copiar TODOS los archivos que Playit haya creado
                  echo "📁 Archivos a guardar:"
                  ls -lah ~/.config/playit_gg/
                  
                  if rclone copy ~/.config/playit_gg/ gdrive:playit_config/ -v; then
                    echo ""
                    echo "✅ ¡CONFIGURACIÓN GUARDADA!"
                    echo "🎉 Próximos runs usarán la misma IP"
                    CONFIG_GUARDADA=true
                  fi
                else
                  echo "💚 Configuración permanente activa"
                fi
                
              elif [ -n "$LINK" ]; then
                echo "⚠️  ACCIÓN REQUERIDA - VINCULA TU AGENTE"
                echo ""
                echo "🔗 $LINK"
                echo ""
                echo "📝 INSTRUCCIONES:"
                echo "   1. Haz clic en el link"
                echo "   2. Inicia sesión en Playit.gg"
                echo "   3. Después de vincular, ve a:"
                echo "      https://playit.gg/account/tunnels"
                echo "   4. Crea un túnel TCP para el puerto 25565"
                echo ""
                echo "⏳ Esperando..."
                
              else
                echo "⏳ Iniciando túnel Playit..."
                echo ""
                echo "📋 Últimas líneas:"
                tail -n 4 playit.log 2>/dev/null | grep -v "^$" || echo "   (sin logs relevantes)"
              fi
              
              echo ""
              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              echo ""
              
              sleep 20
            done
          ) &
          
          # Arrancar Minecraft
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎮 INICIANDO SERVIDOR MINECRAFT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          cd servidor
          
          if [ ! -f "run.sh" ]; then
            echo "❌ ERROR: run.sh no encontrado"
            ls -la
            exit 1
          fi
          
          echo "eula=true" > eula.txt
          chmod +x run.sh
          
          ./run.sh

      - name: Guardar mundo y configuración final
        if: always()
        run: |
          echo ""
          echo "💾 ===== GUARDADO FINAL ====="
          echo ""
          
          # Guardar mundo
          echo "📦 Comprimiendo mundo..."
          tar -czf ZerdolandIII.tar.gz servidor
          echo "☁️  Subiendo..."
          rclone copy ZerdolandIII.tar.gz gdrive: -v || true
          
          # Guardar configuración Playit
          echo ""
          echo "🔑 Respaldando configuración..."
          if [ -d ~/.config/playit_gg ] && [ "$(ls -A ~/.config/playit_gg 2>/dev/null)" ]; then
            ls -lah ~/.config/playit_gg/
            rclone copy ~/.config/playit_gg/ gdrive:playit_config/ -v || true
            echo "✅ Respaldo completado"
          else
            echo "⚠️ Sin configuración que respaldar"
          fi
          
          echo ""
          echo "✅ GUARDADO COMPLETADO"
