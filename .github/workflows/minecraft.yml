name: Servidor Minecraft 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: servidor-minecraft
  cancel-in-progress: true

jobs:
  iniciar_servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Preparar Java (JAVA 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Rclone (Conexión a Drive)
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Descargar el mundo y llave
        run: |
          # Descargar llave si existe
          rclone copy gdrive:playit.toml ./ || true
          
          # Descargar mundo
          rclone copy gdrive:ZerdolandIII.tar.gz ./ || true
          if [ -f "ZerdolandIII.tar.gz" ]; then
            tar -xzf ZerdolandIII.tar.gz
            rm ZerdolandIII.tar.gz
          else
            mkdir -p servidor
            rclone copy gdrive:ZerdolandIII ./servidor --transfers 8 || true
          fi

      - name: Configurar Playit
        run: |
          # Descargar ejecutable portátil
          curl -SsL -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          
          # Configurar directorio de trabajo
          mkdir -p ~/.config/playit_gg
          
          # Restaurar llave si existe
          if [ -f "playit.toml" ]; then
            cp playit.toml ~/.config/playit_gg/playit.toml
            chmod 600 ~/.config/playit_gg/playit.toml
          fi

      - name: Arrancar Playit y Servidor
        run: |
          # EL PARCHE DEFINITIVO: Obligamos a usar /tmp para el socket invisible
          export XDG_RUNTIME_DIR=/tmp
          
          # Ejecutar Playit SIN SUDO
          ./playit &> playit.log &
          
          echo "Esperando arranque de Playit..."
          sleep 8
          
          # Monitor inteligente
          (
            LLAVE_GUARDADA=false
            
            while true; do
              LINK=$(grep -oE 'https://playit\.gg/claim/[a-zA-Z0-9-]+' playit.log 2>/dev/null | head -1 || true)
              IP=$(grep -oE '[a-zA-Z0-9-]+\.(gl\.joinmc\.link|auto\.playit\.gg)' playit.log 2>/dev/null | head -1 || true)
              
              if [ -f "$HOME/.config/playit_gg/playit.toml" ]; then
                TIENE_SECRET=$(grep -c "secret_key" "$HOME/.config/playit_gg/playit.toml" 2>/dev/null || echo "0")
              else
                TIENE_SECRET=0
              fi
              
              echo ""
              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              
              if [ -n "$IP" ]; then
                echo "✅ SERVIDOR ACTIVO: $IP"
                
                # Guardar llave SOLO si tiene secret_key y no se ha guardado
                if [ "$TIENE_SECRET" -gt 0 ] && [ "$LLAVE_GUARDADA" = false ]; then
                  echo "💾 Guardando llave vinculada..."
                  sleep 3 
                  
                  cp "$HOME/.config/playit_gg/playit.toml" ./playit.toml
                  
                  if rclone copy ./playit.toml gdrive: -v; then
                    echo "✅ LLAVE GUARDADA EN DRIVE"
                    LLAVE_GUARDADA=true
                  fi
                fi
                
              elif [ -n "$LINK" ]; then
                echo "⚠️ FALTA VINCULAR PLAYIT. CLICA AQUÍ YA: $LINK"
              else
                echo "⏳ Iniciando túnel Playit..."
                echo "📋 Últimos mensajes:"
                tail -n 3 playit.log 2>/dev/null || echo "Sin logs aún"
              fi
              
              echo "🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴🔴"
              echo ""
              sleep 20
            done
          ) &
          
          # Arrancar Minecraft
          cd servidor
          echo "eula=true" > eula.txt
          chmod +x run.sh
          ./run.sh

      - name: Guardar mundo y llave (FINAL)
        if: always()
        run: |
          echo "📦 Guardando mundo..."
          tar -czf ZerdolandIII.tar.gz servidor
          rclone copy ZerdolandIII.tar.gz gdrive: -v || true
          
          if [ -f "$HOME/.config/playit_gg/playit.toml" ]; then
            cp "$HOME/.config/playit_gg/playit.toml" ./playit.toml
            rclone copy ./playit.toml gdrive: -v || true
          fi
